# 공통 설정. 접속 정보·키는 전부 환경 변수로만 받는다 (이 파일에 실제 값 금지)
spring:
  application:
    name: cheongyak-server
  profiles:
    default: local              # 프로필을 안 주면 local (H2 메모리 DB)
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # 테이블은 Flyway(db/migration)로만 만든다
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    expires-minutes: 60
  gemini:
    api-key: ${GEMINI_API_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

---
# local: 설치 없이 실행 (메모리 DB, 끄면 데이터 사라짐). Flyway 마이그레이션도 그대로 돈다
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:cheongyak;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console

---
# prod: 실제 PostgreSQL (Supabase). 서버에서 SPRING_PROFILES_ACTIVE=prod + DB_URL 등 환경 변수로 실행
spring:
  config:
    activate:
      on-profile: prod
