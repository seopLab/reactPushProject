plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cheongyak'
version = '0.0.1-SNAPSHOT'
description = 'Cheongyak server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 서버에 올릴 실행 파일 이름 고정: build/libs/server.jar
tasks.named('bootJar') {
	archiveFileName = 'server.jar'
}

// 공고문 분석기 콘솔 실행: gradlew analyzeNotice --args="<PDF URL 또는 경로>"  (GEMINI_API_KEY 필요)
tasks.register('analyzeNotice', JavaExec) {
	group = 'ai'
	description = '공고문 PDF 를 Gemini 로 분석해 JSON 으로 출력'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.cheongyak.ai.NoticeAnalyzerCli'
	workingDir = projectDir
	defaultCharacterEncoding = 'UTF-8'
}

// 정확도 비교: gradlew checkAccuracy --args="<AI 결과.json> <정답지.json>"
tasks.register('checkAccuracy', JavaExec) {
	group = 'ai'
	description = 'AI 분석 결과를 정답지와 항목별로 비교'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.cheongyak.ai.AnalysisAccuracyCli'
	workingDir = projectDir
	defaultCharacterEncoding = 'UTF-8'
}

// 실행 안 되는 plain jar 는 만들지 않음
tasks.named('jar') {
	enabled = false
}
